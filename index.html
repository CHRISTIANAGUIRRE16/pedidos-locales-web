<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel Administrador | Pedidos Locales</title>
    <link rel="stylesheet" href="./styles.css?v=20260804-alerts" />
  </head>
  <body>
    <main id="app">
      <section class="auth-card" id="auth-view">
        <div>
          <p class="eyebrow">Pedidos Locales</p>
          <h1>Panel administrador</h1>
          <p class="muted">Ingresa con tu cuenta administradora para revisar pedidos, clientes, negocios y solicitudes.</p>
        </div>
        <form id="login-form" class="form">
          <label>
            Correo
            <input id="email" type="email" autocomplete="email" required />
          </label>
          <label>
            Contraseña
            <input id="password" type="password" autocomplete="current-password" required />
          </label>
          <button type="submit">Ingresar</button>
          <p id="login-error" class="error" role="alert"></p>
        </form>
      </section>

      <section class="dashboard hidden" id="dashboard-view">
        <aside class="sidebar">
          <div>
            <p class="eyebrow">Pedidos Locales</p>
            <h2>Administrador</h2>
          </div>
          <nav>
            <button class="tab active" data-tab="overview">Resumen</button>
            <button class="tab" data-tab="orders">Pedidos</button>
            <button class="tab" data-tab="businesses">Negocios</button>
            <button class="tab" data-tab="clients">Clientes</button>
            <button class="tab" data-tab="requests">Solicitudes</button>
          </nav>
          <button id="logout-button" class="ghost">Cerrar sesión</button>
        </aside>

        <section class="content">
          <header class="topbar">
            <div>
              <p class="eyebrow">Panel web seguro</p>
              <h1 id="page-title">Resumen</h1>
            </div>
            <div class="topbar-actions">
              <button id="notification-button" class="secondary hidden" type="button">Activar avisos</button>
              <button id="refresh-button" class="secondary" type="button">Actualizar</button>
            </div>
          </header>

          <p id="status-message" class="status"></p>

          <section id="overview" class="panel"></section>
          <section id="orders" class="panel hidden"></section>
          <section id="businesses" class="panel hidden"></section>
          <section id="clients" class="panel hidden"></section>
          <section id="requests" class="panel hidden"></section>
        </section>
      </section>
    </main>

    <div id="toast-stack" class="toast-stack" aria-live="polite" aria-atomic="false"></div>

    <script type="module" src="./app.js?v=20260804-alerts"></script>
  </body>
</html>
